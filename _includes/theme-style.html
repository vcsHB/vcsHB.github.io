<style>
    /* =====================================================================
       테마 시스템
       - data-theme : light | dark | pixel | pocket  (색 토큰)
       - data-style : flat | pixel                   (형태 규칙)
       색과 형태를 분리해 두어, 픽셀 계열 테마를 추가할 때 토큰만 정의하면 된다.
       --game-* 토큰은 아케이드(Tofu Project) 캔버스가 읽어 스프라이트를 다시 칠한다.
       ===================================================================== */

    :root {
        --game-bg: #f5f7fb;
        --game-grid: #d5dceb;
        --game-player: #0366d6;
        --game-enemy: #2b2b2b;
        --game-bullet-a: #e0245e;
        --game-bullet-b: #7b3fe4;
        --game-core: #ffffff;
        --game-shot: #0366d6;
        --pixel-font: "Galmuri11", "Galmuri9", ui-monospace, monospace;

        /* 아케이드 난이도 색 — 테마와 무관하게 구분되도록 고정 */
        --diff-easy: #3fbf6f;
        --diff-normal: #3d8bff;
        --diff-hard: #ff9a3c;
        --diff-lunatic: #e8457a;
    }

    [data-theme='dark'] {
        --game-bg: #121212;
        --game-grid: #2e2e2e;
        --game-player: #58a6ff;
        --game-enemy: #e0e0e0;
        --game-bullet-a: #ff6b8b;
        --game-bullet-b: #b48cff;
        --game-core: #ffffff;
        --game-shot: #58a6ff;
    }

    /* 8-BIT — 깊은 남색 바탕에 골드/핑크/시안 3색 포인트 */
    [data-theme='pixel'] {
        --bg-color: #0e0b1f;
        --text-color: #f3eeff;
        --card-bg: #1b1638;
        --card-border: #4a3f8f;
        --modal-bg: #1b1638;
        --sub-text: #a99fd6;
        --accent-color: #ffd23f;
        --gauge-bg: #2a2352;
        --gauge-gradient: rgba(27, 22, 56, 0.75);
        --px-shadow: #05030d;
        --px-accent-2: #ff5c8a;
        --px-accent-3: #3ee6f0;
        --px-dot: #1f1a40;
        --px-scan: rgba(0, 0, 0, 0.18);

        --game-bg: #0e0b1f;
        --game-grid: #2f2760;
        --game-player: #3ee6f0;
        --game-enemy: #ff5c8a;
        --game-bullet-a: #ffd23f;
        --game-bullet-b: #ff5c8a;
        --game-core: #ffffff;
        --game-shot: #3ee6f0;
    }

    /* POCKET — 4계조 녹색 LCD 휴대용 게임기 느낌 */
    [data-theme='pocket'] {
        --bg-color: #9bbc0f;
        --text-color: #0f380f;
        --card-bg: #8bac0f;
        --card-border: #306230;
        --modal-bg: #8bac0f;
        --sub-text: #306230;
        --accent-color: #0f380f;
        --gauge-bg: #9bbc0f;
        --gauge-gradient: rgba(139, 172, 15, 0.75);
        --px-shadow: #0f380f;
        --px-accent-2: #306230;
        --px-accent-3: #0f380f;
        --px-dot: #8bac0f;
        --px-scan: rgba(15, 56, 15, 0.07);

        --game-bg: #9bbc0f;
        --game-grid: #8bac0f;
        --game-player: #0f380f;
        --game-enemy: #306230;
        --game-bullet-a: #0f380f;
        --game-bullet-b: #306230;
        --game-core: #9bbc0f;
        --game-shot: #306230;

        --diff-easy: #306230;
        --diff-normal: #306230;
        --diff-hard: #0f380f;
        --diff-lunatic: #0f380f;
    }

    /* ---------- 테마 선택기 ---------- */
    .theme-picker {
        position: fixed;
        top: 25px;
        right: 25px;
        z-index: 20001;
    }

    .theme-picker .theme-switch {
        position: static;
    }

    .theme-menu {
        position: absolute;
        top: 55px;
        right: 0;
        margin: 0;
        padding: 6px;
        list-style: none;
        min-width: 170px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .theme-menu[hidden] {
        display: none;
    }

    .theme-option {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 9px;
        background: none;
        color: var(--text-color);
        font-size: 14px;
        text-align: left;
        cursor: pointer;
    }

    .theme-option:hover,
    .theme-option:focus-visible {
        background: var(--gauge-bg);
        outline: none;
    }

    .theme-option[aria-checked='true'] {
        font-weight: 700;
    }

    .theme-option[aria-checked='true']::after {
        content: '✓';
        margin-left: auto;
        color: var(--accent-color);
    }

    .theme-swatch {
        display: inline-flex;
        flex: 0 0 auto;
        border: 1px solid rgba(128, 128, 128, 0.45);
    }

    .theme-swatch i {
        width: 10px;
        height: 16px;
    }

    /* =====================================================================
       픽셀 스타일 공통 규칙 (8-BIT, POCKET)
       ===================================================================== */
    [data-style='pixel'] {
        scrollbar-color: var(--card-border) var(--bg-color);
    }

    [data-style='pixel'] body {
        font-family: var(--pixel-font);
        line-height: 1.75;
        letter-spacing: 0.01em;
        -webkit-font-smoothing: none;
        background-image: radial-gradient(var(--px-dot) 1.5px, transparent 1.5px);
        background-size: 16px 16px;
        transition: none;
    }

    /* 은은한 스캔라인 — 클릭을 가로채지 않도록 pointer-events를 끈다. */
    [data-style='pixel'] body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 30000;
        pointer-events: none;
        background: repeating-linear-gradient(to bottom, var(--px-scan) 0 1px, transparent 1px 3px);
    }

    [data-theme='pocket'] body::after {
        background:
            repeating-linear-gradient(to bottom, var(--px-scan) 0 1px, transparent 1px 3px),
            repeating-linear-gradient(to right, var(--px-scan) 0 1px, transparent 1px 3px);
    }

    [data-style='pixel'] ::selection {
        background: var(--accent-color);
        color: var(--bg-color);
    }

    [data-style='pixel'] :is(h1, h2, h3, h4) {
        font-weight: 700;
        letter-spacing: 0.02em;
    }

    [data-style='pixel'] section > h1 {
        color: var(--accent-color);
        text-shadow: 3px 3px 0 var(--px-accent-2);
    }

    [data-style='pixel'] section > h1::after {
        content: '_';
        margin-left: 4px;
        color: var(--px-accent-3);
        text-shadow: none;
        animation: px-blink 1s steps(1) infinite;
    }

    [data-style='pixel'] a:hover {
        text-decoration: none;
        filter: none;
        background: var(--accent-color);
        color: var(--bg-color);
    }

    /* 둥근 모서리와 부드러운 그림자를 걷어내고, 딱딱한 오프셋 그림자로 교체 */
    [data-style='pixel'] :is(.project-card, .github-profile-card, .github-profile-readme,
        .modal-content, .review-section, .review-display-box, .profile-block, #searchInput,
        .review-item-btn, .theme-menu, .theme-option, .theme-switch, .close-modal,
        .thumbnail-container img, .modal-header-image, .project-page-cover, .profile-avatar,
        .category-badge, .arcade-screen, .arcade-stage) {
        border-radius: 0 !important;
    }

    [data-style='pixel'] .theme-switch,
    [data-style='pixel'] .theme-menu {
        border: 3px solid var(--card-border);
        box-shadow: 4px 4px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] .theme-switch:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] .theme-option[aria-checked='true']::after {
        content: '◀';
    }

    [data-style='pixel'] .project-card {
        border: 3px solid var(--card-border);
        box-shadow: 6px 6px 0 0 var(--px-shadow);
        transition: transform 0.12s steps(3), box-shadow 0.12s steps(3), border-color 0.12s steps(3);
    }

    [data-style='pixel'] .project-card:hover {
        transform: translate(-3px, -3px);
        border-color: var(--hover-color);
        box-shadow: 9px 9px 0 0 var(--hover-color);
    }

    [data-style='pixel'] .project-card:focus-visible {
        outline: 3px dashed var(--accent-color);
        outline-offset: 6px;
    }

    [data-style='pixel'] .thumbnail-container img {
        border: 3px solid var(--card-border);
        box-sizing: border-box;
    }

    [data-style='pixel'] .category-badge {
        box-shadow: 2px 2px 0 0 var(--px-shadow);
        letter-spacing: 0.04em;
    }

    [data-style='pixel'] .tab-container {
        border-bottom: 3px solid var(--card-border);
    }

    [data-style='pixel'] .tab-link {
        border-bottom-width: 4px;
        margin-bottom: -3px;
        transition: none;
    }

    [data-style='pixel'] .tab-link:hover {
        color: var(--text-color);
    }

    [data-style='pixel'] .tab-link.active {
        color: var(--accent-color);
        border-bottom: 4px solid var(--accent-color);
    }

    [data-style='pixel'] .tab-link.active::before {
        content: '▶ ';
        animation: px-blink 1.2s steps(1) infinite;
    }

    [data-style='pixel'] :is(.github-profile-card, .github-profile-readme, .review-section) {
        border: 3px solid var(--card-border);
        box-shadow: 6px 6px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] .profile-avatar {
        border: 3px solid var(--accent-color);
        image-rendering: pixelated;
        box-shadow: 4px 4px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] .profile-block {
        border-width: 2px;
        border-left-width: 6px;
    }

    [data-style='pixel'] .progress-ring {
        filter: none;
    }

    [data-style='pixel'] .progress-ring-circle {
        stroke-linecap: butt;
        transition: stroke-dashoffset 1s steps(12);
    }

    [data-style='pixel'] .gauge-item {
        transition: transform 0.15s steps(2);
    }

    [data-style='pixel'] .gauge-item:hover {
        transform: translateY(-6px);
    }

    [data-style='pixel'] .history-list {
        border-left: 4px dashed var(--card-border);
    }

    [data-style='pixel'] .history-item::before {
        left: -44px;
        border-radius: 0;
        border: 0;
        width: 12px;
        height: 12px;
        box-shadow: 3px 3px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] .history-date::before {
        content: '> ';
    }

    [data-style='pixel'] #searchInput {
        border: 3px solid var(--card-border);
        box-shadow: inset 3px 3px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] #searchInput:focus {
        outline: 3px solid var(--accent-color);
        outline-offset: 2px;
    }

    [data-style='pixel'] .modal {
        backdrop-filter: none;
        background: rgba(5, 3, 13, 0.82);
    }

    [data-style='pixel'] .modal-content {
        border: 4px solid var(--card-border);
        box-shadow: 10px 10px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] #modalBody img,
    [data-style='pixel'] .project-page img {
        border: 3px solid var(--card-border);
    }

    [data-style='pixel'] .review-item-btn {
        border: 3px solid var(--card-border);
        transition: none;
    }

    [data-style='pixel'] .review-item-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0 0 var(--px-shadow);
    }

    [data-style='pixel'] .review-display-box {
        border-width: 3px;
    }

    [data-theme='pixel'] .review-section {
        background: rgba(255, 255, 255, 0.03);
    }

    [data-style='pixel'] :is(th, td) {
        border-width: 2px;
    }

    [data-style='pixel'] .loading-spinner {
        border-radius: 0;
        animation: spin 0.8s steps(4) infinite;
    }

    /* ---------- POCKET 전용: 4계조에 맞춰 강제로 다시 칠한다 ---------- */
    [data-theme='pocket'] img {
        filter: grayscale(1) sepia(1) hue-rotate(42deg) saturate(2.4) brightness(0.8) contrast(1.2);
    }

    /* 상세 내용을 볼 때는 원래 색을 확인할 수 있게 한다. */
    [data-theme='pocket'] #modalBody img:hover,
    [data-theme='pocket'] .project-page img:hover {
        filter: none;
    }

    [data-theme='pocket'] .category-badge {
        background: #306230 !important;
        color: #9bbc0f !important;
    }

    [data-theme='pocket'] .project-card {
        --hover-color: #0f380f !important;
    }

    [data-theme='pocket'] .profile-block {
        --block-accent: #306230 !important;
    }

    [data-theme='pocket'] .skill-gauge-bar {
        stroke: #0f380f !important;
    }

    [data-theme='pocket'] .skill-gauge-label {
        color: #0f380f !important;
    }

    [data-theme='pocket'] a {
        text-decoration: underline dotted;
        text-underline-offset: 3px;
    }

    /* 탭이 4개가 되면서 좁은 화면에서 가로 넘침이 생겨 간격을 줄인다. */
    @media (max-width: 560px) {
        .tab-container {
            gap: 2px;
        }

        .tab-link {
            padding: 10px 9px;
            font-size: 15px;
        }

        [data-style='pixel'] .tab-link.active::before {
            content: '▶';
        }
    }

    @keyframes px-blink {
        50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        [data-style='pixel'] section > h1::after,
        [data-style='pixel'] .tab-link.active::before {
            animation: none;
        }
    }
</style>
