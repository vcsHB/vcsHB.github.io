<script>
    // marked / prism 은 head.html 에서 defer로 한 번만 로드한다.

    let lastFocusedCard = null;

    function openModal(cardElement, isInitialLoad = false) {
        const modal = document.getElementById("portfolioModal");
        const modalBody = document.getElementById("modalBody");
        const modalTitle = document.getElementById("modalTitle");
        const modalThumbnail = document.getElementById("modalThumbnail");
        const modalCategories = document.getElementById("modalCategories");

        if (!cardElement || !modal || !modalBody) return;

        const title = cardElement.querySelector('h3').textContent.trim();
        const thumb = cardElement.querySelector('.thumbnail-container img');

        modalTitle.textContent = title;
        modalThumbnail.src = thumb.src;
        modalThumbnail.alt = title + ' 커버 이미지';
        modalCategories.innerHTML = cardElement.querySelector('.project-categories').innerHTML;
        modalBody.innerHTML = marked.parse(cardElement.querySelector('.project-content-raw').innerHTML);

        // 모달 본문은 열릴 때 처음 DOM에 들어오므로 지연 로딩을 걸어도 안전하다.
        modalBody.querySelectorAll('img').forEach(img => {
            if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
            if (!img.hasAttribute('alt')) img.setAttribute('alt', '');
        });
        modalBody.querySelectorAll('iframe').forEach(f => {
            if (!f.hasAttribute('loading')) f.setAttribute('loading', 'lazy');
        });

        modal.style.display = "block";
        document.body.style.overflow = "hidden";
        modal.scrollTop = 0;

        if (window.Prism) Prism.highlightAllUnder(modalBody);

        lastFocusedCard = cardElement;
        document.querySelector('.close-modal').focus();

        const newUrl = new URL(window.location);
        newUrl.searchParams.set('project', title);

        if (isInitialLoad) {
            window.history.replaceState({ isModal: true }, '', newUrl);
        } else {
            window.history.pushState({ isModal: true }, '', newUrl);
        }
    }

    function closeModal(isPopState = false) {
        const modal = document.getElementById("portfolioModal");
        if (!modal || modal.style.display !== "block") return;

        modal.style.display = "none";
        document.body.style.overflow = "auto";

        // 모달을 열었던 카드로 포커스를 되돌려 키보드 흐름이 끊기지 않게 한다.
        if (lastFocusedCard) {
            lastFocusedCard.focus();
            lastFocusedCard = null;
        }

        if (isPopState !== true) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('project');
            window.history.pushState({}, '', newUrl);
        }
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });
</script>
