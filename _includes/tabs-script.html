<script>
    // 탭 전환의 순수 DOM 부분. 히스토리를 건드리지 않으므로
    // 초기 로드/popstate 복원에서도 안전하게 재사용할 수 있다.
    function activateTab(tabName) {
        const panels = document.getElementsByClassName("tab-content");
        for (let i = 0; i < panels.length; i++) {
            panels[i].style.display = "none";
            panels[i].classList.remove("active");
        }

        const links = document.getElementsByClassName("tab-link");
        for (let i = 0; i < links.length; i++) {
            links[i].classList.remove("active");
            links[i].setAttribute("aria-selected", "false");
        }

        const panel = document.getElementById(tabName);
        if (!panel) return;
        panel.style.display = "block";
        panel.classList.add("active");

        const btn = document.querySelector('.tab-link[aria-controls="' + tabName + '"]');
        if (btn) {
            btn.classList.add("active");
            btn.setAttribute("aria-selected", "true");
        }

        if (tabName === 'Profile') loadProfileReadme();
    }

    // 사용자 클릭 진입점 — 여기서만 히스토리를 쌓는다.
    function openTab(evt, tabName) {
        activateTab(tabName);

        const newUrl = new URL(window.location);
        newUrl.searchParams.set('tab', tabName);
        newUrl.searchParams.delete('project');
        window.history.pushState({ tab: tabName }, '', newUrl);
    }

    // fetch가 비동기라 innerHTML만으로는 중복 호출을 막지 못한다.
    // (activateTab과 DOMContentLoaded가 같은 틱에 둘 다 호출할 수 있음)
    let profileReadmeRequested = false;

    function loadProfileReadme() {
        const contentEl = document.getElementById('profileReadmeContent');
        const cardEl = document.querySelector('.github-profile-readme');
        if (!contentEl || profileReadmeRequested) return;
        profileReadmeRequested = true;

        fetch('{{ "/assets/profile.md" | relative_url }}')
            .then(res => {
                if (!res.ok) throw new Error(res.status);
                return res.text();
            })
            .then(markdown => {
                if (!window.marked) throw new Error('marked not loaded');
                contentEl.innerHTML = marked.parse(markdown);
                if (window.Prism) Prism.highlightAllUnder(contentEl);
                requestAnimationFrame(() => cardEl.classList.add('active'));
            })
            .catch(() => {
                contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
                if (cardEl) cardEl.classList.add('active');
            });
    }

    document.addEventListener("DOMContentLoaded", function () {
        // 기본 활성 탭(Profile)일 때만 여기서 로드한다.
        // 딥링크로 다른 탭이 열리는 경우는 activateTab이 처리한다.
        const active = document.querySelector('.tab-link.active');
        if (active && active.getAttribute('aria-controls') === 'Profile') {
            loadProfileReadme();
        }
    });
</script>
